<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>what do we watch</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500&display=swap");
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f7f5f9; color: #1a1a1a;
      font-family: "Geist Mono", ui-monospace, monospace;
      min-height: 100vh; padding: clamp(24px,5vw,60px) clamp(20px,5vw,40px);
      -webkit-font-smoothing: antialiased;
    }
    .frame { max-width: 560px; margin: 0 auto; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 36px; }
    .logo { display: flex; align-items: center; gap: 8px; font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: #999; }
    .who { display: flex; gap: 6px; }
    .who-btn {
      appearance: none; background: #fff; border: 1.5px solid #e0dce6; color: #aaa;
      font-family: inherit; font-size: 9px; letter-spacing: .18em; text-transform: uppercase;
      padding: 7px 14px; cursor: pointer; border-radius: 20px; transition: all .18s;
    }
    .who-btn.active.m { background: #e8f4fb; border-color: #90c8e0; color: #4a9ab5; }
    .who-btn.active.a { background: #fce8f2; border-color: #e090b8; color: #b54a80; }
    .wheel-wrap { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-bottom: 44px; }
    .wheel-outer { position: relative; width: clamp(240px,52vw,300px); height: clamp(240px,52vw,300px); }
    canvas#wheel { width: 100%; height: 100%; display: block; }
    .wheel-pointer {
      position: absolute; top: 50%; right: -14px; transform: translateY(-50%);
      width: 0; height: 0; border-top: 10px solid transparent; border-bottom: 10px solid transparent;
      border-right: 18px solid #c084ab;
    }
    .spin-btn {
      appearance: none; background: #fff; border: 1.5px solid #d4c8e0; color: #7a5fa0;
      font-family: inherit; font-size: 10px; letter-spacing: .22em; text-transform: uppercase;
      padding: 12px 32px; cursor: pointer; border-radius: 30px; transition: all .2s;
    }
    .spin-btn:hover:not(:disabled) { background: #f0ebf8; border-color: #a07ac8; }
    .spin-btn:disabled { opacity: .35; cursor: not-allowed; }
    .result { text-align: center; min-height: 44px; }
    .result-label { font-size: 8px; letter-spacing: .24em; text-transform: uppercase; color: #bbb; margin-bottom: 6px; }
    .result-title { font-size: clamp(16px,4vw,22px); font-weight: 500; color: #1a1a1a; opacity: 0; transform: translateY(5px); transition: opacity .35s, transform .35s; }
    .result-title.show { opacity: 1; transform: none; }
    .result-who { font-size: 9px; letter-spacing: .16em; margin-top: 5px; opacity: 0; transition: opacity .35s .12s; }
    .result-who.show { opacity: 1; }
    hr { border: none; border-top: 1px solid #e8e4ed; margin: 32px 0; }
    .add-row { display: flex; gap: 8px; margin-bottom: 20px; }
    .add-input {
      flex: 1; background: #fff; border: 1.5px solid #e0dce6; color: #1a1a1a;
      font-family: inherit; font-size: 12px; padding: 10px 14px; border-radius: 10px;
      outline: none; transition: border-color .18s;
    }
    .add-input:focus { border-color: #a07ac8; }
    .add-input::placeholder { color: #ccc; }
    .add-btn {
      appearance: none; background: #fff; border: 1.5px solid #e0dce6; color: #a07ac8;
      font-family: inherit; font-size: 9px; letter-spacing: .18em; text-transform: uppercase;
      padding: 10px 16px; border-radius: 10px; cursor: pointer; transition: all .18s; white-space: nowrap;
    }
    .add-btn:hover { border-color: #a07ac8; background: #f5f0fc; }
    .movie-list { display: flex; flex-direction: column; gap: 5px; }
    .movie-item {
      display: flex; align-items: center; gap: 10px; padding: 10px 14px;
      background: #fff; border: 1.5px solid #ede9f2; border-radius: 10px;
      animation: fadeIn .25s ease;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(3px); } to { opacity:1; transform:none; } }
    .badge { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 500; flex: none; }
    .badge-m { background: #e8f4fb; color: #4a9ab5; }
    .badge-a { background: #fce8f2; color: #b54a80; }
    .movie-name { flex: 1; font-size: 12px; color: #333; }
    .del-btn { appearance: none; background: none; border: none; color: #ddd; font-size: 15px; cursor: pointer; padding: 0 4px; line-height: 1; transition: color .15s; }
    .del-btn:hover { color: #e090b8; }
    .empty { text-align: center; padding: 32px 0; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: #ccc; }
    .sync-status { text-align: center; font-size: 8px; letter-spacing: .18em; color: #bbb; margin-bottom: 12px; min-height: 14px; }
    .foot { margin-top: 48px; text-align: center; font-size: 8px; letter-spacing: .2em; color: #ccc; }
  </style>
</head>
<body>
<div class="frame">
  <div class="header">
    <div class="logo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M12 21C12 21 3 14.5 3 8.5C3 5.42 5.42 3 8.5 3C10.24 3 11.91 3.81 13 5.08C13 5.08 13 5.08 12 21Z" fill="#c084ab" opacity=".5"/>
        <path d="M12 21C12 21 21 14.5 21 8.5C21 5.42 18.58 3 15.5 3C13.76 3 12.09 3.81 11 5.08C11 5.08 11 5.08 12 21Z" fill="#c084ab"/>
        <text x="12" y="13" text-anchor="middle" font-family="monospace" font-size="5" font-weight="600" fill="white" dy=".1em">&#8709;</text>
      </svg>
      watch
    </div>
    <div class="who">
      <button class="who-btn m" data-user="M" onclick="setUser('M')">Maciej</button>
      <button class="who-btn a" data-user="A" onclick="setUser('A')">Agata</button>
    </div>
  </div>

  <div class="wheel-wrap">
    <div class="wheel-outer">
      <canvas id="wheel" width="600" height="600"></canvas>
      <div class="wheel-pointer"></div>
    </div>
    <button class="spin-btn" id="spinBtn" onclick="spin()">spin</button>
    <div class="result">
      <div class="result-label" id="resultLabel" style="display:none">tonight we watch</div>
      <div class="result-title" id="resultTitle"></div>
      <div class="result-who" id="resultWho"></div>
    </div>
  </div>

  <hr>
  <div class="sync-status" id="syncStatus">loading...</div>
  <div class="add-row">
    <input class="add-input" id="addInput" type="text" placeholder="add a movie or series..." maxlength="80" onkeydown="if(event.key==='Enter') addMovie()">
    <button class="add-btn" onclick="addMovie()">+ add</button>
  </div>
  <div class="movie-list" id="movieList"></div>
  <div class="empty" id="emptyMsg">nothing here yet &#9825;</div>
  <div class="foot">&#8709; nullrose &middot; private</div>
</div>

<script>
  const BLOB = 'https://jsonblob.com/api/jsonBlob/019f2ecc-5cca-7396-b30f-c9fad219c477';
  const USER_KEY = 'nr-watch-user';
  let movies = [];
  let currentUser = localStorage.getItem(USER_KEY) || 'M';
  let spinning = false, rotation = 0, saving = false;

  function setUser(u) {
    currentUser = u;
    localStorage.setItem(USER_KEY, u);
    document.querySelectorAll('.who-btn').forEach(b => b.classList.toggle('active', b.dataset.user === u));
  }
  setUser(currentUser);

  function status(msg) { document.getElementById('syncStatus').textContent = msg; }

  async function load() {
    try {
      const r = await fetch(BLOB, { headers: { 'Accept': 'application/json' } });
      const d = await r.json();
      movies = d.movies || [];
      status('');
      renderList(); drawWheel();
    } catch(e) { status('sync error'); }
  }

  async function save() {
    if (saving) return;
    saving = true; status('saving...');
    try {
      await fetch(BLOB, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ movies })
      });
      status('');
    } catch(e) { status('save error'); }
    saving = false;
  }

  async function addMovie() {
    const inp = document.getElementById('addInput');
    const name = inp.value.trim();
    if (!name) return;
    inp.value = '';
    movies.push({ name, who: currentUser, id: Date.now() });
    renderList(); drawWheel();
    await save();
  }

  async function removeMovie(id) {
    movies = movies.filter(m => m.id !== id);
    renderList(); drawWheel();
    await save();
  }

  function renderList() {
    const list = document.getElementById('movieList');
    const empty = document.getElementById('emptyMsg');
    empty.style.display = movies.length ? 'none' : 'block';
    list.innerHTML = movies.map(m => `
      <div class="movie-item">
        <span class="badge badge-${m.who.toLowerCase()}">${m.who}</span>
        <span class="movie-name">${escHtml(m.name)}</span>
        <button class="del-btn" onclick="removeMovie(${m.id})">&#215;</button>
      </div>
    `).join('');
  }

  function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function segFill(who, i) {
    if (who === 'M') return ['#ddf0f8','#cce8f4'][i%2];
    if (who === 'A') return ['#fce8f2','#f8d8ec'][i%2];
    return ['#f0ecf8','#e8e4f4'][i%2];
  }

  function drawWheel(hi=-1) {
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, cx = W/2, cy = W/2, r = W/2-6;
    ctx.clearRect(0,0,W,W);
    if (!movies.length) {
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle='#f0ecf8'; ctx.fill();
      ctx.fillStyle='#ccc'; ctx.font='400 13px Geist Mono,monospace';
      ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('add movies first',cx,cy); return;
    }
    const n=movies.length, arc=(Math.PI*2)/n;
    movies.forEach((m,i)=>{
      const s=rotation+i*arc-Math.PI/2, e=s+arc;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,s,e); ctx.closePath();
      ctx.fillStyle=i===hi?'#e8d8f8':segFill(m.who,i); ctx.fill();
      ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(s+arc/2);
      ctx.textAlign='right'; ctx.textBaseline='middle';
      ctx.beginPath(); ctx.arc(r*.84,0,4,0,Math.PI*2);
      ctx.fillStyle=m.who==='M'?'#90c8e0':'#e090b8'; ctx.fill();
      const maxW=r*.58; ctx.font=`400 ${n>14?9:11}px Geist Mono,monospace`; ctx.fillStyle='#444';
      let lab=m.name;
      while(ctx.measureText(lab).width>maxW&&lab.length>2) lab=lab.slice(0,-1);
      if(lab!==m.name) lab=lab.slice(0,-1)+'…';
      ctx.fillText(lab,r*.62,0); ctx.restore();
    });
    ctx.beginPath(); ctx.arc(cx,cy,18,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
    ctx.strokeStyle='#e0d8ec'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.fillStyle='#c084ab'; ctx.font='500 11px Geist Mono,monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('∅',cx,cy);
  }

  function spin() {
    if (spinning||!movies.length) return;
    spinning=true; document.getElementById('spinBtn').disabled=true;
    const rt=document.getElementById('resultTitle'), rw=document.getElementById('resultWho'), rl=document.getElementById('resultLabel');
    rt.classList.remove('show'); rw.classList.remove('show'); rl.style.display='none';
    const n=movies.length, arc=(Math.PI*2)/n, ti=Math.floor(Math.random()*n);
    const extra=(6+Math.random()*4)*Math.PI*2;
    const ta=Math.PI/2-(ti*arc+arc/2);
    const total=extra+ta-(rotation%(Math.PI*2));
    const dur=3600+Math.random()*800, sr=rotation, t0=performance.now();
    function frame(now){
      const t=Math.min((now-t0)/dur,1), e=1-Math.pow(1-t,3);
      rotation=sr+total*e; drawWheel(t===1?ti:-1);
      if(t<1){requestAnimationFrame(frame);return;}
      spinning=false; document.getElementById('spinBtn').disabled=false;
      const p=movies[ti]; rl.style.display='block';
      rt.textContent=p.name; rw.textContent='added by '+(p.who==='M'?'Maciej':'Agata');
      rw.style.color=p.who==='M'?'#4a9ab5':'#b54a80';
      setTimeout(()=>{rt.classList.add('show');rw.classList.add('show');},40);
    }
    requestAnimationFrame(frame);
  }

  load();
  setInterval(load, 15000);
</script>
</body>
</html>
