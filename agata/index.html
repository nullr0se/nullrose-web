<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>what do we watch</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;600&display=swap");
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0D0D0C; color: #fff;
      font-family: "Geist Mono", ui-monospace, monospace;
      min-height: 100vh; padding: clamp(24px,5vw,60px) clamp(20px,5vw,40px);
      -webkit-font-smoothing: antialiased;
    }
    .frame { max-width: 560px; margin: 0 auto; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
    .logo { display: flex; align-items: center; gap: 9px; font-size: 10px; letter-spacing: .28em; text-transform: uppercase; color: rgba(180,126,222,.6); }
    .who { display: flex; gap: 7px; }
    .who-btn {
      appearance: none; background: rgba(138,79,178,.06); border: 1px solid rgba(180,126,222,.24); color: rgba(180,126,222,.6);
      font-family: inherit; font-size: 9px; letter-spacing: .2em; text-transform: uppercase;
      padding: 7px 14px; cursor: pointer; border-radius: 20px; transition: all .18s;
    }
    .who-btn:hover { border-color: rgba(180,126,222,.6); color: #C99CF2; }
    .who-btn.active.m { border-color: #7ec8e3; background: rgba(126,200,227,.12); color: #7ec8e3; }
    .who-btn.active.a { border-color: #e37eb4; background: rgba(227,126,180,.12); color: #e37eb4; }
    .mode-tabs { display: flex; margin-bottom: 36px; border: 1px solid rgba(180,126,222,.22); }
    .mode-tab {
      flex: 1; appearance: none; background: transparent; border: none;
      font-family: inherit; font-size: 9px; letter-spacing: .24em; text-transform: uppercase;
      color: rgba(180,126,222,.4); padding: 11px 0; cursor: pointer; transition: all .2s; position: relative;
    }
    .mode-tab + .mode-tab { border-left: 1px solid rgba(180,126,222,.22); }
    .mode-tab:hover { color: rgba(180,126,222,.8); background: rgba(138,79,178,.05); }
    .mode-tab.active { color: #C99CF2; background: rgba(138,79,178,.12); }
    .mode-tab.active::after {
      content: ""; position: absolute; bottom: -1px; left: 20%; right: 20%; height: 1px;
      background: #C99CF2; box-shadow: 0 0 8px rgba(201,156,242,.6);
    }
    .wheel-wrap { display: flex; flex-direction: column; align-items: center; gap: 22px; margin-bottom: 48px; }
    .wheel-outer { position: relative; width: clamp(240px,52vw,300px); height: clamp(240px,52vw,300px); }
    canvas#wheel { width: 100%; height: 100%; display: block; }
    .wheel-pointer {
      position: absolute; top: 50%; right: -14px; transform: translateY(-50%);
      width: 0; height: 0; border-top: 10px solid transparent; border-bottom: 10px solid transparent;
      border-right: 18px solid #C99CF2; filter: drop-shadow(0 0 6px rgba(201,156,242,.7));
    }
    .spin-btn {
      appearance: none; background: rgba(138,79,178,.1); border: 1px solid rgba(180,126,222,.5); color: #C99CF2;
      font-family: inherit; font-size: 10px; letter-spacing: .28em; text-transform: uppercase;
      padding: 13px 36px; cursor: pointer; transition: all .2s;
    }
    .spin-btn:hover:not(:disabled) { background: rgba(138,79,178,.25); box-shadow: 0 0 24px rgba(138,79,178,.35); color: #fff; }
    .spin-btn:disabled { opacity: .3; cursor: not-allowed; }
    .result { text-align: center; min-height: 44px; }
    .result-label { font-size: 8px; letter-spacing: .28em; text-transform: uppercase; color: rgba(180,126,222,.45); margin-bottom: 7px; }
    .result-title { font-size: clamp(16px,4vw,22px); font-weight: 500; color: #fff; opacity: 0; transform: translateY(5px); transition: opacity .35s, transform .35s; }
    .result-title.show { opacity: 1; transform: none; }
    .result-who { font-size: 9px; letter-spacing: .16em; margin-top: 5px; opacity: 0; transition: opacity .35s .12s; }
    .result-who.show { opacity: 1; }
    hr { border: none; border-top: 1px solid rgba(180,126,222,.18); margin: 32px 0; }
    .add-row { display: flex; gap: 8px; margin-bottom: 18px; }
    .add-input {
      flex: 1; background: rgba(138,79,178,.05); border: 1px solid rgba(180,126,222,.22); color: #fff;
      font-family: inherit; font-size: 12px; padding: 10px 14px; outline: none; transition: border-color .18s;
    }
    .add-input:focus { border-color: rgba(180,126,222,.7); }
    .add-input::placeholder { color: rgba(180,126,222,.3); }
    .add-btn {
      appearance: none; background: rgba(138,79,178,.1); border: 1px solid rgba(180,126,222,.3); color: #C99CF2;
      font-family: inherit; font-size: 9px; letter-spacing: .18em; text-transform: uppercase;
      padding: 10px 16px; cursor: pointer; transition: all .18s; white-space: nowrap;
    }
    .add-btn:hover { border-color: #C99CF2; background: rgba(138,79,178,.22); color: #fff; }
    .movie-list { display: flex; flex-direction: column; gap: 5px; }
    .movie-item {
      display: flex; align-items: center; gap: 10px; padding: 10px 14px;
      background: rgba(16,15,20,.8); border: 1px solid rgba(180,126,222,.16);
      animation: fadeIn .25s ease;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(3px); } to { opacity:1; transform:none; } }
    .badge { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 500; flex: none; }
    .badge-m { background: rgba(126,200,227,.12); color: #7ec8e3; border: 1px solid rgba(126,200,227,.3); }
    .badge-a { background: rgba(227,126,180,.12); color: #e37eb4; border: 1px solid rgba(227,126,180,.3); }
    .movie-name { flex: 1; font-size: 12px; color: rgba(255,255,255,.85); }
    .del-btn { appearance: none; background: none; border: none; color: rgba(180,126,222,.25); font-size: 15px; cursor: pointer; padding: 0 4px; line-height: 1; transition: color .15s; }
    .del-btn:hover { color: #e37eb4; }
    .empty { text-align: center; padding: 32px 0; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: rgba(180,126,222,.3); }
    .sync-status { text-align: center; font-size: 8px; letter-spacing: .18em; color: rgba(180,126,222,.4); margin-bottom: 12px; min-height: 14px; }
    .foot { margin-top: 52px; text-align: center; font-size: 8px; letter-spacing: .24em; color: rgba(180,126,222,.2); }
  </style>
</head>
<body>
<div class="frame">
  <div class="header">
    <div class="logo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M12 21C12 21 3 14.5 3 8.5C3 5.42 5.42 3 8.5 3C10.24 3 11.91 3.81 13 5.08C13 5.08 13 5.08 12 21Z" fill="#8A4FB2" opacity=".55"/>
        <path d="M12 21C12 21 21 14.5 21 8.5C21 5.42 18.58 3 15.5 3C13.76 3 12.09 3.81 11 5.08C11 5.08 11 5.08 12 21Z" fill="#C99CF2"/>
        <text x="12" y="13" text-anchor="middle" font-family="monospace" font-size="5" font-weight="600" fill="white" dy=".1em">&#8709;</text>
      </svg>
      watch
    </div>
    <div class="who">
      <button class="who-btn m" data-user="M" onclick="setUser('M')">Maciej</button>
      <button class="who-btn a" data-user="A" onclick="setUser('A')">Agata</button>
    </div>
  </div>

  <div class="mode-tabs">
    <button class="mode-tab active" id="tab-movies" onclick="setMode('movies')">&#9632; movies</button>
    <button class="mode-tab" id="tab-shows" onclick="setMode('shows')">&#9644; tv shows</button>
  </div>

  <div class="wheel-wrap">
    <div class="wheel-outer">
      <canvas id="wheel" width="600" height="600"></canvas>
      <div class="wheel-pointer"></div>
    </div>
    <button class="spin-btn" id="spinBtn" onclick="spin()">&#9654; spin</button>
    <div class="result">
      <div class="result-label" id="resultLabel" style="display:none">tonight we watch</div>
      <div class="result-title" id="resultTitle"></div>
      <div class="result-who" id="resultWho"></div>
    </div>
  </div>

  <hr>
  <div class="sync-status" id="syncStatus">loading...</div>
  <div class="add-row">
    <input class="add-input" id="addInput" type="text" placeholder="add a movie..." maxlength="80" onkeydown="if(event.key==='Enter') addItem()">
    <button class="add-btn" onclick="addItem()">+ add</button>
  </div>
  <div class="movie-list" id="movieList"></div>
  <div class="empty" id="emptyMsg">nothing here yet &#9825;</div>
  <div class="foot">&#8709; nullrose &middot; private</div>
</div>

<script>
  const DB_BASE = 'https://kreciolek-91e3a-default-rtdb.europe-west1.firebasedatabase.app';
  const USER_KEY = 'nr-watch-user';
  const MODE_KEY = 'nr-watch-mode';

  let lists = { movies: [], shows: [] };
  let rotations = { movies: 0, shows: 0 };
  let currentUser = localStorage.getItem(USER_KEY) || 'M';
  let currentMode = localStorage.getItem(MODE_KEY) || 'movies';
  let spinning = false, saving = false;

  function items() { return lists[currentMode]; }
  function dbUrl() { return `${DB_BASE}/${currentMode}.json`; }

  function setUser(u) {
    currentUser = u; localStorage.setItem(USER_KEY, u);
    document.querySelectorAll('.who-btn').forEach(b => b.classList.toggle('active', b.dataset.user === u));
  }
  setUser(currentUser);

  function setMode(m) {
    currentMode = m; localStorage.setItem(MODE_KEY, m);
    document.getElementById('tab-movies').classList.toggle('active', m === 'movies');
    document.getElementById('tab-shows').classList.toggle('active', m === 'shows');
    document.getElementById('addInput').placeholder = m === 'movies' ? 'add a movie...' : 'add a tv show...';
    document.getElementById('resultLabel').style.display = 'none';
    document.getElementById('resultTitle').classList.remove('show');
    document.getElementById('resultWho').classList.remove('show');
    renderList(); drawWheel();
    load();
  }

  function status(msg) { document.getElementById('syncStatus').textContent = msg; }

  async function load() {
    try {
      const r = await fetch(dbUrl());
      const d = await r.json();
      lists[currentMode] = d || [];
      status(''); renderList(); drawWheel();
    } catch(e) { status('sync error'); }
  }

  async function save() {
    if (saving) return;
    saving = true; status('saving...');
    try {
      await fetch(dbUrl(), { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(items()) });
      status('');
    } catch(e) { status('save error'); }
    saving = false;
  }

  async function addItem() {
    const inp = document.getElementById('addInput');
    const name = inp.value.trim(); if (!name) return;
    inp.value = '';
    items().push({ name, who: currentUser, id: Date.now() });
    renderList(); drawWheel(); await save();
  }

  async function removeItem(id) {
    lists[currentMode] = items().filter(m => m.id !== id);
    renderList(); drawWheel(); await save();
  }

  function renderList() {
    const list = document.getElementById('movieList');
    document.getElementById('emptyMsg').style.display = items().length ? 'none' : 'block';
    list.innerHTML = items().map(m => `
      <div class="movie-item">
        <span class="badge badge-${m.who.toLowerCase()}">${m.who}</span>
        <span class="movie-name">${escHtml(m.name)}</span>
        <button class="del-btn" onclick="removeItem(${m.id})">&#215;</button>
      </div>`).join('');
  }

  function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function segFill(who, i) {
    if (who==='M') return ['#1a2e3d','#152637'][i%2];
    if (who==='A') return ['#3d1a2e','#371526'][i%2];
    return ['#1e1c28','#1a1824'][i%2];
  }

  function drawWheel(hi=-1) {
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const W=canvas.width, cx=W/2, cy=W/2, r=W/2-6;
    ctx.clearRect(0,0,W,W);
    const list = items();
    if (!list.length) {
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle='#16151a'; ctx.fill();
      ctx.fillStyle='rgba(180,126,222,.35)'; ctx.font='400 13px Geist Mono,monospace';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(currentMode==='movies'?'add movies first':'add shows first',cx,cy); return;
    }
    const n=list.length, arc=(Math.PI*2)/n, rot=rotations[currentMode];
    list.forEach((m,i)=>{
      const s=rot+i*arc-Math.PI/2, e=s+arc;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,s,e); ctx.closePath();
      ctx.fillStyle=i===hi?'rgba(201,156,242,.2)':segFill(m.who,i); ctx.fill();
      ctx.strokeStyle='rgba(180,126,222,.15)'; ctx.lineWidth=1.5; ctx.stroke();
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(s+arc/2);
      ctx.textAlign='right'; ctx.textBaseline='middle';
      ctx.beginPath(); ctx.arc(r*.84,0,4,0,Math.PI*2);
      ctx.fillStyle=m.who==='M'?'#7ec8e3':'#e37eb4'; ctx.fill();
      const maxW=r*.56; ctx.font=`400 ${n>14?9:11}px Geist Mono,monospace`;
      ctx.fillStyle=i===hi?'#fff':'rgba(255,255,255,.75)';
      let lab=m.name;
      while(ctx.measureText(lab).width>maxW&&lab.length>2) lab=lab.slice(0,-1);
      if(lab!==m.name) lab=lab.slice(0,-1)+'\u2026';
      ctx.fillText(lab,r*.62,0); ctx.restore();
    });
    ctx.beginPath(); ctx.arc(cx,cy,18,0,Math.PI*2); ctx.fillStyle='#0D0D0C'; ctx.fill();
    ctx.strokeStyle='rgba(180,126,222,.4)'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.fillStyle='rgba(201,156,242,.8)'; ctx.font='500 11px Geist Mono,monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('\u2205',cx,cy);
  }

  function spin() {
    if (spinning||!items().length) return;
    spinning=true; document.getElementById('spinBtn').disabled=true;
    const rt=document.getElementById('resultTitle'), rw=document.getElementById('resultWho'), rl=document.getElementById('resultLabel');
    rt.classList.remove('show'); rw.classList.remove('show'); rl.style.display='none';
    const list=items(), n=list.length, arc=(Math.PI*2)/n, ti=Math.floor(Math.random()*n);
    const targetRot = Math.PI/2 - (ti*arc + arc/2);
    let delta = ((targetRot - rotations[currentMode]) % (Math.PI*2) + Math.PI*2) % (Math.PI*2);
    if (delta < 0.1) delta += Math.PI*2;
    const total = delta + (6 + Math.floor(Math.random()*5)) * Math.PI*2;
    const dur=3600+Math.random()*800, sr=rotations[currentMode], t0=performance.now();
    const mode=currentMode;
    function frame(now){
      const t=Math.min((now-t0)/dur,1), e=1-Math.pow(1-t,3);
      rotations[mode]=sr+total*e; drawWheel(t===1?ti:-1);
      if(t<1){requestAnimationFrame(frame);return;}
      spinning=false; document.getElementById('spinBtn').disabled=false;
      const p=list[ti]; rl.style.display='block';
      rt.textContent=p.name; rw.textContent='added by '+(p.who==='M'?'Maciej':'Agata');
      rw.style.color=p.who==='M'?'#7ec8e3':'#e37eb4';
      setTimeout(()=>{rt.classList.add('show');rw.classList.add('show');},40);
    }
    requestAnimationFrame(frame);
  }

  async function loadAll() {
    status('loading...');
    await Promise.all(['movies','shows'].map(async mode => {
      try {
        const r = await fetch(`${DB_BASE}/${mode}.json`);
        const d = await r.json();
        lists[mode] = d || [];
      } catch(e) {}
    }));
    status(''); renderList(); drawWheel();
  }

  loadAll();
  setInterval(load, 15000);
</script>
</body>
</html>
