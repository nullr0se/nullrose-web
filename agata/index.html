<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>what do we watch</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;600&display=swap');

    :root {
      --void: #0D0D0C;
      --carbon: #16151a;
      --purple: #8A4FB2;
      --lilac: #B47EDE;
      --lilac-bright: #C99CF2;
      --white: #fff;
      --line: rgba(180,126,222,.30);
      --mono: 'Geist Mono', ui-monospace, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--void);
      color: var(--white);
      font-family: var(--mono);
      min-height: 100vh;
      padding: clamp(20px, 4vw, 52px);
      -webkit-font-smoothing: antialiased;
    }

    .frame {
      max-width: 720px;
      margin: 0 auto;
    }

    /* ── header ── */
    .top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }
    .wordmark {
      font-size: 11px;
      letter-spacing: .34em;
      text-transform: uppercase;
      color: var(--lilac);
    }
    .wordmark span { color: rgba(180,126,222,.45); }

    /* ── user selector ── */
    .who {
      display: flex;
      gap: 8px;
    }
    .who-btn {
      appearance: none;
      background: rgba(138,79,178,.06);
      border: 1px solid rgba(180,126,222,.28);
      color: var(--lilac);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .24em;
      text-transform: uppercase;
      padding: 7px 14px;
      cursor: pointer;
      transition: all .2s;
    }
    .who-btn:hover { border-color: var(--lilac); background: rgba(138,79,178,.16); }
    .who-btn.active {
      border-color: var(--lilac-bright);
      background: rgba(138,79,178,.28);
      color: #fff;
      box-shadow: 0 0 18px rgba(138,79,178,.35);
    }
    .who-btn.active.m { border-color: #7ec8e3; box-shadow: 0 0 18px rgba(126,200,227,.25); color: #7ec8e3; }
    .who-btn.active.a { border-color: #e37eb4; box-shadow: 0 0 18px rgba(227,126,180,.25); color: #e37eb4; }

    /* ── wheel area ── */
    .wheel-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      margin-bottom: 52px;
    }

    .wheel-outer {
      position: relative;
      width: clamp(260px, 55vw, 340px);
      height: clamp(260px, 55vw, 340px);
    }

    canvas#wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: block;
    }

    .wheel-pointer {
      position: absolute;
      top: 50%;
      right: -18px;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 14px solid transparent;
      border-bottom: 14px solid transparent;
      border-right: 24px solid var(--lilac-bright);
      filter: drop-shadow(0 0 8px rgba(201,156,242,.8));
    }

    .spin-btn {
      appearance: none;
      background: rgba(138,79,178,.1);
      border: 1px solid var(--lilac);
      color: var(--white);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .3em;
      text-transform: uppercase;
      padding: 14px 36px;
      cursor: pointer;
      transition: all .25s;
    }
    .spin-btn:hover:not(:disabled) {
      background: rgba(138,79,178,.28);
      box-shadow: 0 0 28px rgba(138,79,178,.4);
    }
    .spin-btn:disabled { opacity: .4; cursor: not-allowed; }

    /* ── result ── */
    .result {
      text-align: center;
      min-height: 48px;
    }
    .result-label {
      font-size: 9px;
      letter-spacing: .3em;
      text-transform: uppercase;
      color: rgba(180,126,222,.5);
      margin-bottom: 8px;
    }
    .result-title {
      font-size: clamp(18px, 4vw, 26px);
      font-weight: 600;
      letter-spacing: .04em;
      color: var(--white);
      opacity: 0;
      transform: translateY(6px);
      transition: opacity .4s, transform .4s;
    }
    .result-title.show { opacity: 1; transform: none; }
    .result-who {
      font-size: 9px;
      letter-spacing: .2em;
      margin-top: 6px;
      opacity: 0;
      transition: opacity .4s .15s;
    }
    .result-who.show { opacity: 1; }

    /* ── divider ── */
    .divider {
      height: 1px;
      background: var(--line);
      margin-bottom: 36px;
      position: relative;
    }
    .divider::before {
      content: '// LIST';
      position: absolute;
      top: -8px;
      left: 0;
      font-size: 8px;
      letter-spacing: .3em;
      color: rgba(180,126,222,.4);
      background: var(--void);
      padding-right: 12px;
    }

    /* ── add movie ── */
    .add-row {
      display: flex;
      gap: 10px;
      margin-bottom: 28px;
    }
    .add-input {
      flex: 1;
      background: rgba(138,79,178,.05);
      border: 1px solid rgba(180,126,222,.26);
      color: var(--white);
      font-family: var(--mono);
      font-size: 12px;
      padding: 11px 14px;
      outline: none;
      transition: border-color .2s;
    }
    .add-input:focus { border-color: var(--lilac); }
    .add-input::placeholder { color: rgba(180,126,222,.35); }
    .add-btn {
      appearance: none;
      background: rgba(138,79,178,.12);
      border: 1px solid rgba(180,126,222,.4);
      color: var(--lilac);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .2em;
      text-transform: uppercase;
      padding: 11px 18px;
      cursor: pointer;
      white-space: nowrap;
      transition: all .2s;
    }
    .add-btn:hover { border-color: var(--lilac-bright); background: rgba(138,79,178,.24); color: #fff; }

    /* ── movie list ── */
    .movie-list { display: flex; flex-direction: column; gap: 6px; }

    .movie-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border: 1px solid rgba(180,126,222,.16);
      background: rgba(16,15,20,.5);
      transition: border-color .2s;
      animation: fadeIn .3s ease;
    }
    .movie-item:hover { border-color: rgba(180,126,222,.36); }
    @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }

    .movie-badge {
      flex: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0;
    }
    .badge-m { background: rgba(126,200,227,.15); color: #7ec8e3; border: 1px solid rgba(126,200,227,.4); }
    .badge-a { background: rgba(227,126,180,.15); color: #e37eb4; border: 1px solid rgba(227,126,180,.4); }

    .movie-name {
      flex: 1;
      font-size: 12px;
      letter-spacing: .04em;
      color: rgba(255,255,255,.88);
    }

    .movie-del {
      appearance: none;
      background: none;
      border: none;
      color: rgba(180,126,222,.3);
      font-family: var(--mono);
      font-size: 14px;
      cursor: pointer;
      padding: 2px 6px;
      transition: color .2s;
      line-height: 1;
    }
    .movie-del:hover { color: #e37eb4; }

    .empty {
      text-align: center;
      padding: 40px 0;
      font-size: 10px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: rgba(180,126,222,.3);
    }

    /* ── footer ── */
    .foot {
      margin-top: 52px;
      font-size: 8px;
      letter-spacing: .24em;
      color: rgba(180,126,222,.25);
      text-align: center;
    }
  </style>
</head>
<body>
<div class="frame">

  <div class="top">
    <div class="wordmark">_nullrose <span>// watch</span></div>
    <div class="who">
      <button class="who-btn m" data-user="M" onclick="setUser('M')">MACIEJ</button>
      <button class="who-btn a" data-user="A" onclick="setUser('A')">AGATA</button>
    </div>
  </div>

  <div class="wheel-wrap">
    <div class="wheel-outer">
      <canvas id="wheel" width="600" height="600"></canvas>
      <div class="wheel-pointer"></div>
    </div>
    <button class="spin-btn" id="spinBtn" onclick="spin()">▶ SPIN</button>
    <div class="result">
      <div class="result-label" id="resultLabel" style="display:none">picked</div>
      <div class="result-title" id="resultTitle"></div>
      <div class="result-who" id="resultWho"></div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="add-row">
    <input class="add-input" id="addInput" type="text" placeholder="add a movie or series..." maxlength="80"
      onkeydown="if(event.key==='Enter') addMovie()">
    <button class="add-btn" onclick="addMovie()">+ ADD</button>
  </div>

  <div class="movie-list" id="movieList"></div>
  <div class="empty" id="emptyMsg">no movies yet — add one above</div>

  <div class="foot">∅ nullrose // private</div>
</div>

<script>
  const STORAGE_KEY = 'nr-watchlist';
  const USER_KEY = 'nr-watch-user';

  let movies = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let currentUser = localStorage.getItem(USER_KEY) || 'M';
  let spinning = false;

  // ── user ──
  function setUser(u) {
    currentUser = u;
    localStorage.setItem(USER_KEY, u);
    document.querySelectorAll('.who-btn').forEach(b => b.classList.toggle('active', b.dataset.user === u));
  }
  setUser(currentUser);

  // ── list ──
  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(movies)); }

  function addMovie() {
    const inp = document.getElementById('addInput');
    const name = inp.value.trim();
    if (!name) return;
    movies.push({ name, who: currentUser, id: Date.now() });
    save(); inp.value = ''; renderList(); drawWheel();
  }

  function removeMovie(id) {
    movies = movies.filter(m => m.id !== id);
    save(); renderList(); drawWheel();
  }

  function renderList() {
    const list = document.getElementById('movieList');
    const empty = document.getElementById('emptyMsg');
    empty.style.display = movies.length ? 'none' : 'block';
    list.innerHTML = movies.map(m => `
      <div class="movie-item">
        <span class="movie-badge badge-${m.who.toLowerCase()}">${m.who}</span>
        <span class="movie-name">${escHtml(m.name)}</span>
        <button class="movie-del" onclick="removeMovie(${m.id})" title="remove">×</button>
      </div>
    `).join('');
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── wheel ──
  const COLORS_M = ['#1a2d3a','#1e3545','#16283300','#2a3f50'];
  const COLORS_A = ['#3a1a2d','#451e35','#331628','#503f2a'];
  const NEUTRAL  = ['#1e1c24','#231f2e','#1a1720','#201d2a'];

  function segColor(who, i) {
    if (who === 'M') return i % 2 === 0 ? '#1a2e3d' : '#152637';
    if (who === 'A') return i % 2 === 0 ? '#3d1a2e' : '#371526';
    return i % 2 === 0 ? '#1e1c24' : '#1a1720';
  }

  let rotation = 0;

  function drawWheel(highlightIdx = -1) {
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const cx = W / 2, cy = H / 2, r = W / 2 - 4;
    ctx.clearRect(0, 0, W, H);

    if (!movies.length) {
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = '#16151a';
      ctx.fill();
      ctx.strokeStyle = 'rgba(180,126,222,.2)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = 'rgba(180,126,222,.3)';
      ctx.font = '500 13px Geist Mono, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('add movies first', cx, cy);
      return;
    }

    const n = movies.length;
    const arc = (Math.PI * 2) / n;

    movies.forEach((m, i) => {
      const start = rotation + i * arc - Math.PI / 2;
      const end = start + arc;

      // segment
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, start, end);
      ctx.closePath();
      ctx.fillStyle = i === highlightIdx ? 'rgba(201,156,242,.25)' : segColor(m.who, i);
      ctx.fill();
      ctx.strokeStyle = 'rgba(180,126,222,.18)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // label
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(start + arc / 2);
      const dist = r * 0.62;
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';

      // badge dot
      const dotX = dist + 10;
      ctx.beginPath();
      ctx.arc(dotX - dist + (r * 0.88), 0, 5, 0, Math.PI * 2);
      ctx.fillStyle = m.who === 'M' ? 'rgba(126,200,227,.7)' : 'rgba(227,126,180,.7)';
      ctx.fill();

      // text
      const maxW = r * 0.52;
      let label = m.name;
      ctx.font = `500 ${n > 14 ? 9 : 11}px Geist Mono, monospace`;
      ctx.fillStyle = i === highlightIdx ? '#fff' : 'rgba(255,255,255,.82)';
      while (ctx.measureText(label).width > maxW && label.length > 3) label = label.slice(0, -1);
      if (label !== m.name) label = label.slice(0, -1) + '…';
      ctx.fillText(label, dist, 0);
      ctx.restore();
    });

    // center cap
    ctx.beginPath();
    ctx.arc(cx, cy, 22, 0, Math.PI * 2);
    ctx.fillStyle = '#0D0D0C';
    ctx.fill();
    ctx.strokeStyle = 'rgba(180,126,222,.4)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = 'rgba(180,126,222,.7)';
    ctx.font = '600 10px Geist Mono, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('∅', cx, cy);
  }

  function spin() {
    if (spinning || movies.length === 0) return;
    spinning = true;
    document.getElementById('spinBtn').disabled = true;

    const resultTitle = document.getElementById('resultTitle');
    const resultWho = document.getElementById('resultWho');
    const resultLabel = document.getElementById('resultLabel');
    resultTitle.classList.remove('show');
    resultWho.classList.remove('show');
    resultLabel.style.display = 'none';

    const n = movies.length;
    const arc = (Math.PI * 2) / n;
    const targetIdx = Math.floor(Math.random() * n);

    // how many full rotations + land on target
    const extraSpins = (6 + Math.random() * 4) * Math.PI * 2;
    // pointer is at right (0 deg from center), segments start at -PI/2
    // segment center angle (from top, going clockwise) = targetIdx * arc + arc/2
    // we want that center to be at the pointer (right side = 0 from center = +PI/2 from top)
    const targetAngle = Math.PI / 2 - (targetIdx * arc + arc / 2);
    const totalRotation = extraSpins + targetAngle - (rotation % (Math.PI * 2));

    const duration = 3800 + Math.random() * 800;
    const start = performance.now();
    const startRot = rotation;

    function ease(t) {
      // ease out cubic
      return 1 - Math.pow(1 - t, 3);
    }

    function frame(now) {
      const elapsed = now - start;
      const t = Math.min(elapsed / duration, 1);
      rotation = startRot + totalRotation * ease(t);
      drawWheel(t === 1 ? targetIdx : -1);

      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        spinning = false;
        document.getElementById('spinBtn').disabled = false;
        const picked = movies[targetIdx];
        resultLabel.style.display = 'block';
        resultTitle.textContent = picked.name;
        resultWho.textContent = `added by ${picked.who === 'M' ? 'Maciej' : 'Agata'}`;
        resultWho.style.color = picked.who === 'M' ? '#7ec8e3' : '#e37eb4';
        setTimeout(() => { resultTitle.classList.add('show'); resultWho.classList.add('show'); }, 50);
      }
    }
    requestAnimationFrame(frame);
  }

  // init
  renderList();
  drawWheel();
</script>
</body>
</html>
