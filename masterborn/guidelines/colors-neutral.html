<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--text-body);background:var(--surface-card);font-size:15px;font-variant-numeric:tabular-nums}.row{display:flex;gap:12px;flex-wrap:wrap}.s{display:flex;flex-direction:column;gap:4px;width:118px;font-size:12px}.s i{height:56px;border-radius:8px;border:1px solid rgba(0,0,0,.06)}.s b{font-size:13px;font-weight:600}.s span{color:var(--text-muted);font-size:11px}</style></head><body><div class="row"><div class="s"><i style="background:var(--paper-0)"></i><b>Paper 0 card</b><span>--paper-0</span></div><div class="s"><i style="background:var(--paper-50)"></i><b>Paper 50 panel</b><span>--paper-50</span></div><div class="s"><i style="background:var(--paper-75)"></i><b>Paper 75 sunken</b><span>--paper-75</span></div><div class="s"><i style="background:var(--paper-100)"></i><b>Paper 100 page</b><span>--paper-100</span></div><div class="s"><i style="background:var(--paper-200)"></i><b>Paper 200 strip</b><span>--paper-200</span></div></div><div class="row" style="margin-top:12px"><div class="s"><i style="background:var(--paper-300)"></i><b>Paper 300 border</b><span>--paper-300</span></div><div class="s"><i style="background:var(--paper-400)"></i><b>Paper 400 control</b><span>--paper-400</span></div><div class="s"><i style="background:var(--ink-900)"></i><b>Ink 900 body</b><span>--ink-900</span></div><div class="s"><i style="background:var(--ink-700)"></i><b>Ink 700 secondary</b><span>--ink-700</span></div><div class="s"><i style="background:var(--ink-500)"></i><b>Ink 500 muted</b><span>--ink-500</span></div></div></body></html>
