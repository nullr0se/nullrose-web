<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--text-body);background:var(--surface-card);font-size:15px;font-variant-numeric:tabular-nums}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px 20px;font-size:13px"><div style="display:flex;align-items:center;gap:8px"><i style="width:20px;height:20px;border-radius:5px;background:var(--surface-page);border:1px solid rgba(0,0,0,.08)"></i>--surface-page</div><div style="display:flex;align-items:center;gap:8px"><i style="width:20px;height:20px;border-radius:5px;background:var(--surface-card);border:1px solid rgba(0,0,0,.08)"></i>--surface-card</div><div style="display:flex;align-items:center;gap:8px"><i style="width:20px;height:20px;border-radius:5px;background:var(--surface-sunken);border:1px solid rgba(0,0,0,.08)"></i>--surface-sunken</div><div style="display:flex;align-items:center;gap:8px"><i style="width:20px;height:20px;border-radius:5px;background:var(--surface-panel);border:1px solid rgba(0,0,0,.08)"></i>--surface-panel</div><div style="display:flex;align-items:center;gap:8px"><i style="width:20px;height:20px;border-radius:5px;background:var(--surface-strip);border:1px solid rgba(0,0,0,.08)"></i>--surface-strip</div><div style="display:flex;align-items:center;gap:8px"><i style="width:20px;height:20px;border-radius:5px;background:var(--surface-selected);border:1px solid rgba(0,0,0,.08)"></i>--surface-selected</div><div style="display:flex;align-items:center;gap:8px"><i style="width:20px;height:20px;border-radius:5px;background:var(--text-body);border:1px solid rgba(0,0,0,.08)"></i>--text-body</div><div style="display:flex;align-items:center;gap:8px"><i style="width:20px;height:20px;border-radius:5px;background:var(--text-secondary);border:1px solid rgba(0,0,0,.08)"></i>--text-secondary</div><div style="display:flex;align-items:center;gap:8px"><i style="width:20px;height:20px;border-radius:5px;background:var(--text-muted);border:1px solid rgba(0,0,0,.08)"></i>--text-muted</div><div style="display:flex;align-items:center;gap:8px"><i style="width:20px;height:20px;border-radius:5px;background:var(--border-default);border:1px solid rgba(0,0,0,.08)"></i>--border-default</div><div style="display:flex;align-items:center;gap:8px"><i style="width:20px;height:20px;border-radius:5px;background:var(--border-strong);border:1px solid rgba(0,0,0,.08)"></i>--border-strong</div><div style="display:flex;align-items:center;gap:8px"><i style="width:20px;height:20px;border-radius:5px;background:var(--action-primary);border:1px solid rgba(0,0,0,.08)"></i>--action-primary</div><div style="display:flex;align-items:center;gap:8px"><i style="width:20px;height:20px;border-radius:5px;background:var(--danger-fg);border:1px solid rgba(0,0,0,.08)"></i>--danger-fg</div><div style="display:flex;align-items:center;gap:8px"><i style="width:20px;height:20px;border-radius:5px;background:var(--danger-bg);border:1px solid rgba(0,0,0,.08)"></i>--danger-bg</div><div style="display:flex;align-items:center;gap:8px"><i style="width:20px;height:20px;border-radius:5px;background:var(--focus-ring);border:1px solid rgba(0,0,0,.08)"></i>--focus-ring</div></div></body></html>
