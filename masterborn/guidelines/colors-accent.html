<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--text-body);background:var(--surface-card);font-size:15px;font-variant-numeric:tabular-nums}.row{display:flex;gap:12px;flex-wrap:wrap}.s{display:flex;flex-direction:column;gap:4px;width:118px;font-size:12px}.s i{height:56px;border-radius:8px;border:1px solid rgba(0,0,0,.06)}.s b{font-size:13px;font-weight:600}.s span{color:var(--text-muted);font-size:11px}</style></head><body><div class="row"><div class="s"><i style="background:var(--blue-800)"></i><b>Blue 800 hover</b><span>--blue-800</span></div><div class="s"><i style="background:var(--blue-600)"></i><b>Blue 600 primary</b><span>--blue-600</span></div><div class="s"><i style="background:var(--blue-100)"></i><b>Blue 100 selected</b><span>--blue-100</span></div><div class="s"><i style="background:var(--blue-50)"></i><b>Blue 50 new row</b><span>--blue-50</span></div><div class="s"><i style="background:var(--blue-25)"></i><b>Blue 25 row hover</b><span>--blue-25</span></div></div></body></html>
