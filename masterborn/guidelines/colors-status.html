<!-- @dsCard group="Colors" viewport="700x130" name="Status" subtitle="Five tones, always paired with icon + text" -->
<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--text-body);background:var(--surface-card);font-size:15px;font-variant-numeric:tabular-nums}.row{display:flex;gap:12px;flex-wrap:wrap}.s{display:flex;flex-direction:column;gap:4px;width:118px;font-size:12px}.s i{height:56px;border-radius:8px;border:1px solid rgba(0,0,0,.06)}.s b{font-size:13px;font-weight:600}.s span{color:var(--text-muted);font-size:11px}</style></head><body><div class="row"><div class="s"><i style="background:var(--status-ok-bg);display:grid;place-items:center;color:var(--status-ok-fg);font-weight:600;font-size:14px;font-style:normal">Gotowy</i><b>ok</b><span>--status-ok-fg / -bg</span></div><div class="s"><i style="background:var(--status-warn-bg);display:grid;place-items:center;color:var(--status-warn-fg);font-weight:600;font-size:14px;font-style:normal">Od 14:00</i><b>warn</b><span>--status-warn-fg / -bg</span></div><div class="s"><i style="background:var(--status-busy-bg);display:grid;place-items:center;color:var(--status-busy-fg);font-weight:600;font-size:14px;font-style:normal">Zajęty</i><b>busy</b><span>--status-busy-fg / -bg</span></div><div class="s"><i style="background:var(--status-off-bg);display:grid;place-items:center;color:var(--status-off-fg);font-weight:600;font-size:14px;font-style:normal">Wyłączony</i><b>off</b><span>--status-off-fg / -bg</span></div><div class="s"><i style="background:var(--status-info-bg);display:grid;place-items:center;color:var(--status-info-fg);font-weight:600;font-size:14px;font-style:normal">Przyjazd</i><b>info</b><span>--status-info-fg / -bg</span></div></div></body></html>
