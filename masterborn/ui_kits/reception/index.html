<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HotelManager PRO: Recepcja</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="theme-dark.css">
<link rel="stylesheet" href="states.css">
<script>try{var t=localStorage.getItem('hm-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>body{margin:0;background:var(--surface-page);color:var(--text-body);font:var(--text-body-md);font-variant-numeric:tabular-nums;min-width:0}html{overflow-x:clip}
a{color:var(--action-primary)}a:hover{color:var(--action-primary-hover)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--focus-ring);outline-offset:1px}
.wk-card{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 28px;padding:18px 20px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-lg)}
.wk-fields{display:flex;flex-wrap:wrap;gap:12px;flex:0 1 auto;min-width:0}.wk-range{width:340px;max-width:100%}.wk-guests{width:180px}
.wk-sum{flex:1 1 300px;min-width:0;padding-bottom:2px}.wk-act{flex:none}.wk-done{flex-basis:100%}
.tl-card{background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-lg);overflow:hidden}
.tl-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding:16px 20px}
.tl-legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.tl-legend-l{font:var(--text-label);color:var(--text-secondary);margin:0 2px 0 10px}.tl-legend-l:first-child{margin-left:0}
.tl-scroll{overflow-x:auto;border-top:1px solid var(--border-default)}
.tl-grid{--room-w:244px;--day-min:66px;min-width:calc(var(--room-w) + 14 * var(--day-min))}
.tl-row{display:grid;grid-template-columns:var(--room-w) minmax(0,1fr);border-bottom:1px solid var(--border-default)}
.tl-row:last-child{border-bottom:0}
.tl-room{position:sticky;left:0;z-index:4;background:var(--surface-card);border-right:1px solid var(--border-strong);padding:10px 14px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:5px;min-width:0;box-sizing:border-box}
.tl-head .tl-room,.tl-head{background:var(--surface-sunken)}
.tl-corner{justify-content:flex-end;font:var(--text-label);color:var(--text-secondary)}
.tl-months,.tl-days{display:grid;grid-template-columns:repeat(14,minmax(0,1fr))}
.tl-months>div{padding:8px 8px 2px;font:var(--text-label);color:var(--text-secondary);border-left:1px solid var(--border-default);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-head .tl-day{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0 8px;font-size:13px;color:var(--text-muted);border-left:1px solid var(--border-default)}
.tl-head .tl-day b{font-size:16px;font-weight:600;color:var(--text-body)}
.tl-day.is-we{background:var(--tl-weekend)}
.tl-head .tl-day.is-today{background:var(--action-primary);color:var(--text-on-accent);font-weight:600}.tl-head .tl-day.is-today b{color:var(--text-on-accent)}
.tl-head .tl-day.is-range{box-shadow:inset 0 -4px 0 var(--action-primary)}
.tl-head .tl-day.is-today.is-range{box-shadow:inset 0 -4px 0 var(--text-body)}
.tl-lane{position:relative;overflow:hidden;min-height:70px}
.tl-bg{position:absolute;inset:0}.tl-bg>div{border-left:1px solid var(--border-default)}
.tl-bg>.is-today{background:var(--tl-today);box-shadow:inset 2px 0 0 var(--action-primary)}
.tl-band{position:absolute;top:0;bottom:0;z-index:1;background:var(--tl-range);box-sizing:border-box;border-left:2px dashed var(--action-primary);border-right:2px dashed var(--action-primary)}
.tl-bar,.tl-ghost{position:absolute;top:50%;transform:translateY(-50%);height:46px;z-index:2;display:flex;align-items:center;gap:6px;padding:0 10px 0 9px;box-sizing:border-box;border:0;border-radius:23px;font:inherit;font-size:14px;line-height:1.25;text-align:left;cursor:pointer;overflow:hidden;min-width:0}
.tl-bar:hover{filter:brightness(1.1)}.tl-bar:focus-visible,.tl-ghost:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px}
.tl-bar svg,.tl-ghost svg{flex:none}
.tl-bar-t{display:flex;flex-direction:column;min-width:0}.tl-bar-t>*{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tl-bar-t b{font-weight:600}
.tl-block{cursor:default;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.1) 0 8px,transparent 8px 16px)!important}.tl-block:hover{filter:none}
.tl-ghost{padding:0 8px;background:var(--surface-card);color:var(--status-info-fg);border:2px dashed var(--action-primary)}
.tl-ghost:hover{background:var(--action-soft)}
.tl-ghost.is-sel{background:var(--action-primary);color:var(--text-on-accent);border-style:solid}
.tl-bar.is-new{box-shadow:0 0 0 2px var(--surface-card),0 0 0 4px var(--text-body)}
.tl-row.is-match{cursor:pointer}.tl-row.is-match .tl-room{box-shadow:inset 4px 0 0 var(--action-primary)}
.tl-row.is-match:hover .tl-room,.tl-row.is-sel .tl-room{background:var(--surface-selected)}
.tl-row.is-dim .tl-lane{opacity:.35}.tl-row.is-dim .tl-no{color:var(--text-muted)}
.tl-no{font:var(--text-room-no)}
.tl-room>*{flex-shrink:0;max-width:100%}.tl-room-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.tl-sub{font-size:14px;color:var(--text-secondary)}
.tl-divider{background:var(--surface-sunken);border-bottom:1px solid var(--border-default)}
.tl-divider>span{position:sticky;left:0;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;font-size:14px;font-weight:600;color:var(--text-secondary)}
.gd-bg{position:fixed;inset:0;z-index:90;background:var(--overlay)}
.gd{position:fixed;top:0;right:0;bottom:0;z-index:91;width:min(460px,100vw);background:var(--surface-card);color:var(--text-body);display:flex;flex-direction:column;box-shadow:var(--shadow-dialog)}
.gd-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 16px 16px 24px;border-bottom:1px solid var(--border-default)}
.gd-body{flex:1;min-height:0;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px}
.gd-foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;padding:14px 24px;border-top:1px solid var(--border-default)}
@media (max-width:1100px){:root{--page-pad:20px}.hm-nav{display:none!important}}
@media (max-width:720px){:root{--page-pad:12px}.hm-date{display:none!important}.tl-grid{--room-w:156px;--day-min:56px}.tl-room{padding:8px 10px}.wk-card{padding:16px}.wk-fields,.wk-range,.wk-guests{width:100%}.wk-act{width:100%}.ed-range{grid-column:auto!important}.gd-body{padding:16px}.gd-foot{padding:12px 16px}}
@media (max-width:520px){.hm-btn-label{display:none}}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<script src="responsive.js"></script>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#2747A0"/><text x="50" y="62" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="30" fill="#fff">HM</text></svg></template>
</head><body><div id="root"></div>
<script type="text/babel" src="StateChip.jsx"></script>
<script type="text/babel" src="RangeField.jsx"></script>
<script type="text/babel" src="AppHeader.jsx"></script>
<script type="text/babel" src="OwnerStrip.jsx"></script>
<script type="text/babel" src="InvoiceFields.jsx"></script>
<script type="text/babel" src="WalkInPanel.jsx"></script>
<script type="text/babel" src="GuestDrawer.jsx"></script>
<script type="text/babel" src="Timeline.jsx"></script>
<script type="text/babel" src="EditReservationDialog.jsx"></script>
<script type="text/babel">
function App() {
  const [, setV] = React.useState(0);
  React.useEffect(() => HM.subscribe(setV), []);
  const [q, setQ] = React.useState({ from: HM.TODAY, to: HM.TODAY + 1, guests: 2 });
  const [active, setActive] = React.useState(true);
  const [pick, setPick] = React.useState(null);
  const [edit, setEdit] = React.useState(null);
  const [done, setDone] = React.useState(null);
  const result = active ? HM.search(q) : null;
  const match = pick && result ? result.available.find(a => a.id === pick) : null;
  React.useEffect(() => { if (pick && !match) setPick(null); }, [pick, match]);
  const onQ = p => { setQ(o => ({ ...o, ...p })); setActive(true); setDone(null); };
  const openRes = edit && HM.state.reservations.includes(edit) ? edit : null;
  return (<>
    <AppHeader />
    <OwnerStrip />
    <main style={{ maxWidth: 'var(--page-max)', margin: '0 auto', padding: '20px var(--page-pad) 64px', display: 'flex', flexDirection: 'column', gap: 16 }}>
      <WalkInPanel q={q} onQ={onQ} active={active} result={result} done={done} onActivate={() => { setActive(true); setDone(null); }} onClear={() => { setActive(false); setPick(null); }} />
      <Timeline result={result} q={q} selRoom={pick} onPickRoom={setPick} onOpenRes={setEdit} />
    </main>
    {match && <GuestDrawer key={match.id} match={match} q={q} onClose={() => setPick(null)} onBooked={d => { setDone(d); setPick(null); setActive(false); }} />}
    {openRes && <EditReservationDialog key={openRes.id} res={openRes} onClose={() => setEdit(null)} />}
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
